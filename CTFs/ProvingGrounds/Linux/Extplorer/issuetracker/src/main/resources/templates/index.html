<!--/*
Index Listing is handled by IssueController.java 
*/-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::title}, ~{::section})">
<head>
    <title>Issue Tracker</title>
</head>
<body>

    <section>
		<div class="container mt-4">
			<span th:include="fragments.html :: session_buttons"></span>
			<br><br>
			<table class="table">
			<thead>
				<tr>
					<th>ID</th>
					<th>Message</th>
					<th>Priority</th>
				</tr>
			</thead>
			<tbody>
	
				<tr th:each="issue:${issuesList}">
					<td th:text="${issue.Id}"></td>
					<td th:text="${issue.message}"></td>
					<td th:text="${issue.priority}"></td>
				</tr>
			</tbody>
			</table>
		</div>
    </section>

</body>
</html>
